<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Safari edge test 2</title>
<style>
  html { background: #000; }
  body { margin: 0; min-height: 300vh; font: 600 14px/1.35 -apple-system, system-ui, sans-serif; color: #fff; }
  .bar { position: fixed; top: 0; width: 33.3333vw; }
  /* A: fixed, top to bottom of the layout viewport */
  #a { left: 0; bottom: 0; background: #e0245e; }
  /* B: fixed, pushed 200px past the top and the bottom */
  #b { left: 33.3333vw; top: -200px; bottom: -200px; background: #1da462; }
  /* C: not fixed at all - a normal page element that is taller than the screen, held with position: sticky */
  #wrap { position: absolute; left: 66.6666vw; top: 0; width: 33.3333vw; height: 300vh; overflow: clip; }
  #c { position: sticky; top: -140px; margin-top: -140px; height: calc(100svh + 140px + 260px); background: #2f6bff; }
  .tag { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 40px); padding: 0 10px; text-shadow: 0 1px 2px #000; z-index: 4; }
  .tag b { display: block; font-size: 17px; margin-bottom: 3px; }
  #out { position: fixed; left: 8px; right: 8px; top: 240px; background: rgba(0,0,0,.72); border-radius: 12px; padding: 12px; z-index: 5; font-weight: 500; white-space: pre-wrap; }
  .mark { position: fixed; left: 0; right: 0; height: 4px; background: #fff; z-index: 6; }
  #mt { top: 0; } #mb { bottom: 0; }
  .probe { position: fixed; left: 0; top: 0; width: 1px; visibility: hidden; }
</style></head><body>
<div class="bar" id="a"></div><div class="bar" id="b"></div>
<div id="wrap"><div id="c"></div></div>
<div class="mark" id="mt"></div><div class="mark" id="mb"></div>
<div class="tag"><b>Edge test 2 (viewport-fit=cover)</b>Pink: fixed top-to-bottom. Green: fixed, 200px past top and bottom. Blue: not fixed, sticky. The white lines mark the top and bottom of the layout viewport. Screenshot at the top of the page, then scroll a little and screenshot again.</div>
<div id="out">measuring…</div>
<div class="probe" id="pst" style="height:env(safe-area-inset-top,0px)"></div><div class="probe" id="psb" style="height:env(safe-area-inset-bottom,0px)"></div>
<div class="probe" id="plvh" style="height:100lvh"></div><div class="probe" id="psvh" style="height:100svh"></div>
<script>
  function report() {
    var h = function (id) { return Math.round(document.getElementById(id).getBoundingClientRect().height * 10) / 10; };
    var vv = window.visualViewport;
    document.getElementById('out').textContent =
      'innerHeight ' + innerHeight + '   screen.height ' + screen.height + '\n' +
      'visualViewport ' + (vv ? Math.round(vv.height * 10) / 10 + ' (top offset ' + Math.round(vv.offsetTop) + ')' : 'n/a') + '\n' +
      '100lvh ' + h('plvh') + '   100svh ' + h('psvh') + '\n' +
      'safe-area top ' + h('pst') + '   bottom ' + h('psb') + '\n' +
      'scrollY ' + Math.round(scrollY) + '   standalone ' + (navigator.standalone === true);
  }
  report(); addEventListener('resize', report); addEventListener('scroll', report, { passive: true });
  if (window.visualViewport) { visualViewport.addEventListener('resize', report); visualViewport.addEventListener('scroll', report); }
</script></body></html>
